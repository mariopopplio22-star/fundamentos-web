<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="/css/estilos-formularios.css">
</head>
<body>

<form class="flat-form">
    <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Mario Bautista">
    </div>

    <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" name="email" placeholder="correo@ejemplo.com">
    </div>

    <div class="form-group">
        <label for="rol">Área o Curso</label>
        <select id="rol" name="rol">
            <option value="" disabled selected>Seleccione una opción</option>
            <option value="db">Bases de Datos</option>
            <option value="sw">Ingeniería de Software</option>
            <option value="ia">Inteligencia Artificial</option>
        </select>
    </div>

    <div class="form-actions">
        <button type="button" class="flat-btn flat-btn-secondary">Cancelar</button>
        <button type="submit" class="flat-btn flat-btn-primary">Guardar Cambios</button>
    </div>
</form>
  
</body>
</html>
